# Central config. Every notebook and src module reads from here.
project_name: ie7615-generative
seed: 42

paths:
  # On Colab, large artifacts go to Drive. Locally they fall back to ./data under the repo.
  drive_root: /content/drive/MyDrive/ie7615-generative
  local_root: data
  # Original images are extracted to fast local disk on Colab (re-extracted from
  # the Drive zip if the runtime was reset). Locally they sit under local_root.
  colab_scratch_root: /content/scratch
  # Sub-directories, relative to the resolved artifact root
  raw: coco/raw
  images: coco/val2017        # relative to the scratch root on Colab
  annotations: coco/annotations
  cache: coco/val2017_512     # 512x512 JPEG cache; manifest file_path points here
  manifest: coco/manifest.jsonl
  embeddings: embeddings
  outputs: outputs
  # Committed sample outputs, relative to the repo root
  milestone1_samples: outputs/milestone1_samples
  # Milestone 2 artifacts, relative to the artifact root (Drive on Colab), so a
  # disconnect never loses a run. Notebook 05 zips the commit-worthy subset.
  milestone2_samples: outputs/milestone2/samples
  milestone2_logs: outputs/milestone2/logs
  bert_adapter_ckpt: checkpoints/bert_to_clip_adapter.pt

data:
  base_url: http://images.cocodataset.org
  annotations_zip: annotations/annotations_trainval2017.zip
  images_zip: zips/val2017.zip
  captions_file: captions_val2017.json
  # MD5 of the official zips (images.cocodataset.org serves plain http only).
  # The annotations MD5 was checked against a real download on 2026-11-02.
  # Set a value to null to skip that check.
  md5:
    annotations_trainval2017.zip: f4bbac642086de4f52a3fdda2de5fa2c
    val2017.zip: 442b8da7639aecaf257c1dceb8ba8c80
  min_words: 4
  max_words: 40

image:
  size: 512
  jpeg_quality: 95

models:
  clip: openai/clip-vit-large-patch14
  bert: google-bert/bert-base-uncased
  diffusion: stable-diffusion-v1-5/stable-diffusion-v1-5
  diffusion_variant: fp16
  # Hub commit SHAs (resolved 2026-11-02), so later upstream edits can't change results.
  revisions:
    clip: 32bd64288804d66eefd0ccbe215aa642df71cc41
    bert: 86b5e0934494bd15c9632b12f734a8a67f723594
    diffusion: 451f4fe16113bff5a5d2269ed5ad43b0592e9a14

embeddings:
  batch_size: 64
  max_length: 77

generation:
  steps: 30
  guidance_scale: 7.5
  scheduler: pndm  # pndm (SD 1.5 default) | ddim | dpm
  height: 512
  width: 512
  attention_slicing: true

bert_adapter:
  hidden_dim: 768
  num_layers: 2
  dropout: 0.1
  batch_size: 128
  epochs: 15
  lr: 3.0e-4
  weight_decay: 1.0e-2
  val_split: 0.1          # fraction of *images* held out (all captions of an image share a side)
  mse_weight: 1.0
  cosine_weight: 0.5
  # Images whose captions are generation prompts. They are kept out of training
  # and validation, so BERT is never scored on its own training data.
  exclude_image_ids: [508586, 201148]

milestone2_sweeps:
  sweep_prompts: [p1_coco_zebra, p2_coco_train, p3_single_object, p4_spatial, p5_style]
  guidance_scales: [1.0, 3.0, 5.0, 7.5, 10.0, 15.0]
  schedulers: [pndm, ddim, dpm, euler]
  steps_list: [10, 20, 30, 50]
  steps_schedulers: [ddim, dpm]
  # CLIP score model. ViT-B/32 is a different model from the L/14 encoder SD conditions on.
  eval_clip_model: openai/clip-vit-base-patch32
  eval_clip_revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268

# Milestone 1 prompts: 2 real COCO val captions, then 3 custom prompts of
# increasing complexity (single object -> multi-object + spatial -> style).
# COCO captions are copied verbatim (cleaned) from captions_val2017.json.
milestone1_prompts:
  - id: p1_coco_zebra
    source: coco_val2017
    image_id: 508586
    caption_id: 422569
    complexity: real caption (natural scene)
    prompt: Herd of zebra grazing on dried grasses in open field.
  - id: p2_coco_train
    source: coco_val2017
    image_id: 201148
    caption_id: 228512
    complexity: real caption (urban scene)
    prompt: A train traveling down tracks next to a brick building.
  - id: p3_single_object
    source: custom
    complexity: single object
    prompt: a red apple on a white wooden table
  - id: p4_spatial
    source: custom
    complexity: multi-object + spatial relation
    prompt: a cat sitting to the left of a dog on a park bench
  - id: p5_style
    source: custom
    complexity: scene + style descriptor
    prompt: a lighthouse on a rocky cliff at sunset, watercolor painting
